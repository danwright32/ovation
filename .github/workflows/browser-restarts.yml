name: Browser restarts

# ovation#332. ovation#316 made a browser that stops answering restart once and
# PRINT that it did, because a fault that heals silently cannot be counted. The
# print goes to a CI log, and a CI log expires: scanning every unsuccessful run of
# this repository on 2026-09-15 found ONE occurrence and 32 runs whose logs could
# no longer be read at all. So the horizon for counting this was however long
# GitHub keeps logs, and the next occurrence would have looked like the first all
# over again, which is exactly what the printed line existed to prevent (L293).
#
# THE RECORD IS CARRIED OUT OF THE RUN THAT MADE IT. CI runs on a fresh runner
# every time, so a file under the runner's home directory is destroyed with the
# machine. The Linux job names the record into its workspace and keeps it as an
# artifact; this reads that artifact and puts what it holds on the tracker, which
# is the only store in this system that does not expire.
#
# WHY A SECOND WORKFLOW RATHER THAN A STEP IN CI. Reporting needs a token that can
# write issues, and CI's needs nothing but read. A workflow_run runs in the base
# repository with its own permissions, so CI's token is left alone and a run from
# a fork is still counted. design-record.yml is the same shape for the same
# reason.
#
# IT NEVER OPENS AN ISSUE AND NEVER CLOSES ONE. Dan decided on 2026-09-15 that an
# automated write must not open an issue on this public tracker by itself, so the
# issue that carries the count is opened by hand, deliberately, and this adds one
# comment per occurrence through `report-finding.sh recurred`. If nothing open
# carries the title this job FAILS and says so, because a recurrence measured and
# reported to nobody is the silent loss the whole record exists to prevent (L98).
# There is no `cleared` either: a restart is an EVENT, not a condition that stops
# being true, so the issue stands until somebody acts on the count.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # To read the artifacts of the run that finished. The token cannot start a run.
  actions: read
  issues: write

concurrency:
  group: browser-restarts
  cancel-in-progress: false

jobs:
  count:
    name: A browser restart is counted where it cannot expire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The name CI keeps the record under. scripts/test-design-render.sh reads
      # this line and the upload step's name out of their own files and refuses
      # when they disagree: nothing in YAML can derive one from the other, and a
      # restart written down and reported to nobody is the silent half of this
      # (L41, L58).
      ARTIFACT: browser-restarts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # THREE OUTCOMES, KEPT APART (L11, L98). `none` there was no record, which
      # is the ordinary state of almost every run; `held` the run kept one;
      # and a lookup that FAILED ends the job, because "no artifact" and "could
      # not ask" must never take the same path: the second would report a quiet
      # all clear about a run nobody read.
      - name: Ask the run that finished whether it recorded a restart
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            echo "Started by hand with no run to read, so there is nothing to count."
            echo "held=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                         --jq '[.artifacts[].name] | join(" ")')"; then
            echo "The artifacts of run ${RUN_ID} could not be read, so whether it" >&2
            echo "recorded a browser restart is unknown. Nothing is reported from a" >&2
            echo "lookup that failed." >&2
            exit 1
          fi
          case " ${names} " in
            *" ${ARTIFACT} "*) ;;
            *) echo "Run ${RUN_ID} kept no ${ARTIFACT} record, so no browser stopped answering in it."
               echo "held=none" >> "$GITHUB_OUTPUT"
               exit 0 ;;
          esac
          if ! gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
                 --name "${ARTIFACT}" --dir record; then
            echo "Run ${RUN_ID} lists a ${ARTIFACT} record that could not be downloaded," >&2
            echo "so what it held is unknown. That is a different thing from the run" >&2
            echo "keeping none, and it is not reported as one." >&2
            exit 1
          fi
          if [ ! -f record/browser-restarts.tsv ]; then
            echo "The ${ARTIFACT} artifact of run ${RUN_ID} holds no browser-restarts.tsv," >&2
            echo "so something other than the renderer wrote it." >&2
            exit 1
          fi
          lines="$(grep -c . record/browser-restarts.tsv)" || lines=0
          if [ "${lines}" -eq 0 ]; then
            echo "The ${ARTIFACT} record of run ${RUN_ID} is empty, and the renderer only" >&2
            echo "creates it by writing a line to it." >&2
            exit 1
          fi
          echo "held=${lines}" >> "$GITHUB_OUTPUT"

      # THE BODY IS BUILT IN A FILE rather than passed inline: an unindented line
      # inside a `--body "..."` ends this YAML block scalar, and the workflow then
      # fails to parse, runs no jobs, and reports a failure with no log to read.
      # ci-liveness.yml records where that was learned.
      #
      # THE MECHANISM IS scripts/report-finding.sh (ovation#339): the lookup, the
      # exact title match, the comment and the creation all live there, with a
      # suite driving every path. This step owns the words only.
      - name: Add this occurrence to the issue that counts them
        if: steps.record.outputs.held != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: A headless browser stopped answering during CI and was restarted
          HELD: ${{ steps.record.outputs.held }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -uo pipefail
          {
            echo "${HELD} restart(s) on $(date -u +%Y-%m-%d), in ${RUN_URL}:"
            echo
            sed 's/^/    /' record/browser-restarts.tsv
            echo
            echo "Each column is when it happened, the request that went unanswered,"
            echo "and the page being rendered."
          } > comment-body.md

          set +e
          bash scripts/report-finding.sh recurred \
            --title "${TITLE}" \
            --comment-file comment-body.md
          reported=$?
          set -e
          # 1 is the only outcome that is not a fault: the occurrence was added to
          # the issue that carries the count. 8 means nothing open carries the
          # title, which fails this job on purpose rather than passing quietly: the
          # restart was measured and nobody was told (L98, L184).
          case "${reported}" in
            1) ;;
            *) exit "${reported}" ;;
          esac
