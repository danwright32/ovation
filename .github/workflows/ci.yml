name: CI

# ovation#143. Until this existed, the pre push hook was the only thing that
# checked anything, and it only runs on a machine where scripts/install-git-hooks.sh
# has been run. Nothing checked a push from anywhere else, and nothing checked the
# branch after it landed.
#
# WHY macOS FOR BOTH JOBS, and what has to be re-measured before that stops being
# right. Standard GitHub hosted runners, macOS included, are free and unlimited on
# a PUBLIC repository, and this repository is public on purpose. The ten times
# multiplier everyone quotes applies to billed minutes, which start the day
# ovation#15 makes it private. So the premise here is not "macOS is free", it is
# "this repository is public", and it can be re-measured in one command:
#
#     gh repo view --json visibility
#
# The day that answers private, this file is the thing to look at: the shell
# suites need no Xcode and would run on Linux for nothing, and moving them is
# untested rather than impossible.
#
# THE ONE MACHINE PROBLEM THIS SOLVES. scripts/build-products.sh exists because
# Dan decided on 2026-09-06 that CI BUILDS BOTH configurations: skipping the
# build dependent suites here would leave the shipping build's bundle assertions
# running on exactly one machine, and those are the assertions that caught a real
# security defect in ovation#9.

on:
  push:
    branches: ['**']
  pull_request:

# A second push supersedes the first. Nothing downstream reads a cancelled run,
# and on a shared runner pool a superseded run delays every other repository's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap half, on its own, because it answers in a couple of minutes and it
  # can fail alone. A job whose isolation does no work is not worth its own
  # minute; this one gates nothing the other job does not, and it tells you which
  # half is broken without waiting for a build (L310).
  shell-suites:
    name: Shell suites
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Ovation.xcodeproj is GENERATED from project.yml and is gitignored, so a
      # fresh checkout has no project at all. The suites that read it answer
      # CANNOT MEASURE without this, which is honest but measures nothing.
      #
      # flock is here for the same reason and it is the sharper one: the runner
      # takes Overture's lock with it and REFUSES to run without it, so its own
      # suite could measure nothing at all. This job does not take any lock, since
      # it skips the phase the locks protect, but the suite that TESTS the locking
      # still needs the tool.
      - name: Install xcodegen and flock
        run: brew install xcodegen flock

      - name: Run every shell suite
        run: |
          set +e
          OVATION_SKIP_XCODE_PHASE=1 bash scripts/run-tests.sh
          status=$?
          set -e
          case "$status" in
            0) ;;
            # CANNOT MEASURE. A runner has no built product, no sibling
            # checkouts and no custody data, so some suites can prove nothing
            # either way here and never could. That is the same policy the push
            # gate applies (ovation#135): allowed, and NAMED, never called green.
            2) echo "::warning::Some shell suites could not measure on this runner. See the log for which." ;;
            *) exit $status ;;
          esac

      # ovation#172. The design record has one section carrying STATUS, and it
      # went on calling two settled screens "not designed yet" for as long as
      # nothing compared it with the tracker. This is the only check that asks
      # GitHub, so it cannot be a push gate: a gate that refuses on every
      # machine without a network is one people learn to skip (L376, L571). Here
      # the token is already present, which is why it runs here and nowhere
      # else.
      #
      # CANNOT MEASURE IS A WARNING, NOT A PASS AND NOT A FAILURE, the same
      # policy every other suite on this runner gets: a rate limit or a lookup
      # that failed proves nothing about the record, and calling it green would
      # be a tick over an unrun check (L98).
      - name: The design record's open list agrees with the tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check-design-record-open.sh
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::The design record's open list could not be checked against the tracker. See the log for which issues." ;;
            *) exit $status ;;
          esac

  # THE SAME SUITES ON LINUX, MEASURED RATHER THAN ASSUMED (ovation#152).
  #
  # The premise of every other job here is that this repository is PUBLIC, where
  # macOS runners are free and unlimited. The day ovation#15 makes it private the
  # ten times multiplier starts, and the shell suites need no Xcode: they would
  # run on ubuntu for nothing, permanently, public or private. Whether they
  # actually PASS there had never been measured, and ovation#15 rests on it.
  #
  # IT IS A REAL JOB RATHER THAN AN INFORMATIONAL ONE. A report-only check still
  # gates in practice, because the merge flow waits for every check, and a job
  # that is allowed to be red teaches everyone to skip reading it (L304, L538).
  # A suite that genuinely cannot answer on Linux says CANNOT MEASURE, which the
  # runner already exits 2 for, and that is a warning here exactly as it is on
  # macOS: allowed, and NAMED, never called green.
  shell-suites-linux:
    name: Shell suites on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ONE SUITE NEEDS Pillow AND NOTHING ELSE DOES. Without it the app icon
      # currency check answers CANNOT MEASURE, which is honest and measures
      # nothing; it is pure Python and runs here as well as anywhere.
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages Pillow

      # ovation#160. The rendered design checks were the only ones that open a
      # design file in a browser and measure what it DRAWS, which is the class
      # of fault no source reading can see, and they ran on exactly one machine:
      # Dan's. Both CI jobs answered CANNOT MEASURE, which is honest and
      # measures nothing, so a push from anywhere else was judged without them.
      # A check that has never run where everyone else's pushes are judged is
      # close to not existing (L400, L98).
      #
      # THE LINUX JOB IS THEIR HOME, because they need no Xcode and a browser
      # here costs a download rather than macOS minutes, which bill at ten times
      # the rate the day ovation#15 makes this repository private. The download
      # is CACHED on the browser's own version, so an upgrade fetches and
      # nothing else does; a cache that restores on every run and saves nothing
      # is a log line rather than a saving (L303, L3).
      - name: Cache the headless browser
        id: browser-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}

      - name: Install the headless browser
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      # PROVED, NOT ASSUMED. Without this the first sign of a browser that did
      # not install is three suites quietly answering CANNOT MEASURE again,
      # which is the state this step exists to end and reads as normal (L3, L98).
      - name: Prove the design checks can now measure
        run: |
          python3 scripts/check-design-draws.sh
          python3 scripts/check-invoice-screen-draws.sh
          python3 scripts/check-clients-screen-draws.sh
          python3 scripts/check-design-tokens-resolve.sh
          python3 scripts/check-design-sidebar-card.sh
          python3 scripts/check-design-window-top.sh

      - name: Run every shell suite
        run: |
          set +e
          OVATION_SKIP_XCODE_PHASE=1 bash scripts/run-tests.sh
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::Some shell suites could not measure on Linux. See the log for which." ;;
            *) exit $status ;;
          esac

  # The half Dan's decision is about.
  build-and-test:
    name: Build both configurations and run everything
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # The runner needs the tool Ovation inherits from Overture's lock. It is
      # installed rather than worked around, so this runs the same run-tests.sh
      # Dan's machine does: a CI only branch through the runner would mean the
      # thing being tested here is not the thing that gates a push (L380).
      - name: Install flock and xcodegen
        run: brew install flock xcodegen

      # THE PROJECT IS GENERATED, NOT COMMITTED. Ovation.xcodeproj is gitignored
      # and produced from project.yml, so a fresh checkout has nothing to build:
      # the first run of this job said `Ovation.xcodeproj does not exist`. It is
      # generated HERE rather than inside scripts/build-products.sh, because that
      # command is also what Dan runs locally and regenerating his project on
      # every build is a different decision from making one on a bare machine.
      - name: Generate the Xcode project
        run: xcodegen generate

      # An unattended keychain, whose password this invents. It is not a secret:
      # it protects a self signed throwaway identity on an ephemeral machine, and
      # the identity exists so the built bundles carry the SAME code identity the
      # bundle assertions were written against.
      # A STEP TIMEOUT, because this is the step that can WAIT rather than fail.
      # The first run of this workflow sat here for minutes: trusting a
      # certificate in a user keychain asks for admin authorisation, and there is
      # nobody to answer. The script takes the admin domain path under sudo now,
      # and this is the bound if some other prompt ever appears (L110).
      - name: Create the signing identity
        timeout-minutes: 5
        env:
          OVATION_SIGNING_KEYCHAIN: ${{ runner.temp }}/ovation-ci.keychain-db
          OVATION_SIGNING_KEYCHAIN_PASSWORD: ovation-ci-throwaway
        run: bash scripts/setup-signing.sh

      # READ IT BACK BEFORE BUILDING. A script that reported success is not an
      # identity codesign can use, and without this the first sign of a bad
      # identity is a build failure that reads as a compiler problem (L12, L3).
      - name: Prove the identity is usable
        run: |
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Ovation Local Signing"

      # The command from scripts/build-products.sh's own header, unchanged. A
      # workflow that rewrote it would be a second definition of the decision.
      - name: Build both, then run everything
        run: |
          set +e
          bash scripts/build-products.sh && bash scripts/run-tests.sh
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::warning::Something could not be measured on this runner. See the log for which." ;;
            *) exit $status ;;
          esac
