# Ported-From: danwright32/overture mac/project.yml @ 8968e380350ec5d59a3dfdfd767e1f3ebf3cf687
#
# Port discipline: docs/PORT-DISCIPLINE.md. Every constant below was re-checked
# against what OVATION needs rather than inherited, and the two that differ from
# the source are called out where they sit. Verified 2026-09-05 that the recorded
# commit is Overture's current main and that mac/project.yml is identical there.
name: Ovation
packages:
  # ADDED BY ovation#59, on the condition this file already recorded: "added with
  # the FIRST test that has to inspect a rendered view, which will be plan 1.13's
  # launch presenter". This is that issue.
  #
  # WHY IT IS WORTH THE DEPENDENCY. The precedent plan 1.13 rests on is
  # postroll#846 and #855, where several presenters shared one surface, one
  # heading landed over another's buttons, and EVERY MODEL LEVEL TEST PASSED
  # while it was happening. A presenter tested only through its own properties
  # would not have caught it, because the defect lives in the binding.
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.0"
options:
  bundleIdPrefix: com.danwright
  deploymentTarget:
    # CHANGED FROM THE SOURCE, which says 14.0. Ovation cannot inherit that.
    # Phase 4 reads receipts with Vision's RecognizeDocumentsRequest, which is
    # macOS 26, and the only SDK installed on this machine is macOS 26.5. A 14.0
    # target would let code that cannot run on the target compile cleanly and
    # push every failure to runtime (L501, L188).
    #
    # THE CONSEQUENCE, PUT TO DAN AND CONFIRMED BY HIM 2026-09-05: this is a hard
    # floor. Ovation will not install or run on any Mac older than macOS 26. His
    # config lists a second Mac, and he confirmed that this machine is the only
    # target, so the floor is accepted rather than merely inherited. Anyone
    # raising or lowering this line is changing that decision, not just a number,
    # which is why the premise is recorded here in a form that can be re-measured
    # rather than as a dated sentence somewhere else (L316).
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ovation reads a backup folder Dan chooses (PRD 5.29) and its own
    # Application Support directory, and the folder grant model in ovation#9
    # depends on those grants being keyed to a stable code identity rather than
    # brokered by the sandbox. Same answer as both siblings.
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    # NO SEPARATE DEBUG DYLIB, and this is a fix rather than a preference.
    #
    # Xcode's default is YES, which splits Debug's code into
    # `Ovation.debug.dylib` (plus a `__preview.dylib`) so SwiftUI previews and
    # hot reload can work. Under ENABLE_HARDENED_RUNTIME above, a loaded library
    # must validate against the loading process's TEAM ID, and the self signed
    # identity below deliberately has none. So dyld refused the dylib and THE
    # DEBUG BUILD DID NOT LAUNCH AT ALL, from 2026-09-06 until ovation#30:
    #
    #   Library not loaded: @rpath/Ovation.debug.dylib
    #   Reason: ... mapping process and mapped file have different Team IDs
    #
    # Nothing caught it, because all three settings are individually correct.
    # Both binaries were signed by the same identity, both reported
    # `TeamIdentifier=not set`, and the built bundle suite passed throughout.
    # Release builds no such dylib and was never affected, so the half that
    # ships was healthy and the harm sat in the half developers use (L142, L417).
    #
    # THE ALTERNATIVE WAS REJECTED. Adding
    # `com.apple.security.cs.disable-library-validation` to the Debug
    # entitlements would also fix it, by switching off the check that is
    # refusing, on the configuration that already carries get-task-allow.
    # Removing the thing that needs the exemption beats granting the exemption.
    #
    # THE COST, stated rather than discovered later: no SwiftUI previews and no
    # hot reload. Neither is used today. Anyone turning this back on is choosing
    # to make the Debug build unlaunchable unless they also give it a real Team
    # ID, which is why scripts/test-project-configuration.sh pins it.
    ENABLE_DEBUG_DYLIB: NO
    # A STABLE, SELF SIGNED IDENTITY. Dan ran scripts/setup-signing.sh on
    # 2026-09-06 and this is now in his login keychain, alongside the three
    # siblings' equivalents, each distinct so a given app's signer is
    # identifiable.
    #
    # It is NOT "-", and that is the whole point of ovation#9. Ad hoc signing
    # mints a NEW code identity on every install, and macOS keys folder
    # permission grants to that identity, so an ad hoc build re prompts for
    # access already granted after every single rebuild. PRD 5.29 has Ovation
    # writing dated backups to a folder Dan chooses and plan 1.8 is where it
    # first asks, so this had to land first. Those backups are the only copy of
    # a seven year tax record.
    #
    # A machine without this identity cannot build Ovation, which is correct
    # rather than unfortunate: the alternative is silently falling back to ad hoc
    # and reintroducing the defect with nothing saying so (L98). Run
    # scripts/setup-signing.sh once per machine; it is idempotent.
    CODE_SIGN_IDENTITY: "Ovation Local Signing"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Ovation:
    type: application
    platform: macOS
    sources:
      - path: Ovation
    dependencies:
      # Plan 1.2: the store schema guard reads the store's raw sqlite_master to
      # confirm the file is Ovation's own before ModelContainer ever opens it.
      # Core Data does not throw on a foreign file, it creates its tables inside
      # whatever it is handed and reports success.
      - sdk: libsqlite3.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ovation/Info.plist
        # Release keeps the canonical identity (the resident /Applications
        # copy). Debug carries a .debug suffix so a dev run is a DISTINCT app to
        # macOS, with its own TCC grants and its own data directory. Plan 1.1 is
        # built directly on this: the suffix is not cosmetic, it is the entire
        # isolation mechanism keeping a dev run from sharing a store, a write
        # ahead log, a Gmail login or a backup folder with the resident copy.
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.ovation
        # Same reasoning. Debug needs its own URL scheme so LaunchServices
        # cannot route an ovation:// open to the wrong build. Read by the single
        # window handler in plan 1.13 and by Info.plist's CFBundleURLTypes.
        OVATION_URL_SCHEME: ovation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # ENTITLEMENTS ARE DECLARED PER CONFIGURATION, and this is a security
        # fix rather than tidiness.
        #
        # `com.apple.security.get-task-allow` lets any process attach a debugger
        # and read the app's memory. Xcode adds it automatically when it thinks
        # it is signing a development build, and a self signed identity with no
        # provisioning profile looks exactly like one, so the moment ovation#9
        # landed BOTH configurations got it. ENABLE_HARDENED_RUNTIME was YES the
        # whole time and both bundles carried the runtime flag, so every reading
        # of the configuration said the app was protected while its main
        # protection was switched off (L188).
        #
        # Release ships with an EMPTY entitlements file: Ovation will hold Gmail
        # refresh tokens carrying send and modify rights on Dan's mailbox, and
        # seven years of tax records.
        #
        # Debug keeps it, or Xcode cannot attach and debugging is broken.
        CODE_SIGN_ENTITLEMENTS: Ovation/Ovation.entitlements
        # An entitlements FILE is not enough on its own. Xcode INJECTS a set of
        # base entitlements on top of whatever the file says whenever it believes
        # it is signing for development, and get-task-allow is in that set. An
        # empty file was tried first and changed nothing, which is the point: the
        # value the configuration sets is not the value in force (L188).
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.danwright.ovation.debug
          OVATION_URL_SCHEME: ovation-debug
          CODE_SIGN_ENTITLEMENTS: Ovation/Ovation-Debug.entitlements
  # The PURE suite, UNHOSTED on purpose, adopted from the source rather than
  # retrofitted later, because the reason it exists there is measured and applies
  # to Ovation from its first test.
  #
  # Overture's #1967: every Swift test used to run inside the launched app, so
  # any fault that stopped the app staying open took all of them at once. On
  # 2026-08-01 a crowded menu bar did exactly that and nothing in the Mac app
  # could be verified, reported only as a runner that "exited with code 0 while
  # preparing to run tests". Ovation raises at least six independent conditions
  # at launch (plan 1.13), several of them refusals whose whole purpose is to be
  # seen, so it has MORE ways to fail at launch than Overture did.
  #
  # It reaches the app's code by COMPILING IT IN rather than linking a host,
  # which is why there is no TEST_HOST and no dependency on the Ovation target.
  # Every declaration keeps its existing visibility, so this costs no access
  # control churn and adds no public API surface. The trade is that those sources
  # compile a second time.
  #
  # OvationApp.swift is the one file it cannot take, because it carries @main.
  #
  # AND IT MUST NOT IMPORT THE APP MODULE (ovation#164). Compiling the sources
  # in is the whole mechanism, so `@testable import Ovation` in a file here names
  # a module nothing in the OvationCore scheme builds: it resolves only against
  # one a PREVIOUS app build left in DerivedData. Forty five files carried that
  # import until 2026-09-09, so the pure suite worked on every machine that had
  # built the app once and on no other, and the first run in a fresh checkout,
  # worktree or new machine answered `unable to resolve module dependency` and
  # `Testing cancelled because the build failed`. Held by
  # scripts/test-project-configuration.sh, seen to fail on a planted file.
  OvationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OvationTests
      - path: Ovation
        excludes:
          - "App/OvationApp.swift"
          - "Info.plist"
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.ovation.tests
# DELIBERATELY ABSENT, with the condition for adding them recorded rather than
# left to be rediscovered:
#
#   LSMultipleInstancesProhibited. Plan 1.3 wants a second running copy to stand
#   aside and NAME the copy it stood aside for, and it says explicitly not to
#   implement that with this key: it appears only in Overture's Info.plist, and
#   Overture's own test runner records that a running Debug app holding that lock
#   makes the xctest host fail to launch, killing the run after a full build.
#   Downbeat implements the refusal in application code instead, which is the
#   sibling pattern rather than a workaround.
  # THE HOSTED SUITE, and it is deliberately tiny.
  #
  # ViewInspector renders a real SwiftUI view, which needs the host process, so
  # this target keeps TEST_HOST and pays the launch risk the pure suite exists to
  # avoid. That is the whole point of the split: a launch fault costs these few
  # files rather than everything, and the pure suite still reports.
  #
  # NOTHING GOES IN HERE THAT DOES NOT HAVE TO RENDER. A test that can be written
  # against a presenter, a store or a value belongs in OvationTests, where a
  # broken app cannot take it down with it.
  OvationHostedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OvationHostedTests
    dependencies:
      - target: Ovation
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.ovation.hostedtests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ovation.app/Contents/MacOS/Ovation"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  # The pure suite's own scheme, and the reason is measured in the source, not
  # theoretical. With both targets in ONE scheme, -only-testing on the pure
  # bundle still made xcodebuild prepare and launch the app host, so a
  # deliberately broken app produced "Test run ... passed" AND a non zero exit at
  # the same time. This scheme builds ONLY the test bundle, so a broken app
  # cannot fail this run and does not even need to compile for it to report.
  OvationCore:
    build:
      targets:
        OvationTests: [test]
    test:
      targets:
        - OvationTests
  Ovation:
    build:
      targets:
        Ovation: all
        OvationTests: [test]
        OvationHostedTests: [test]
    test:
      targets:
        - OvationTests
        - OvationHostedTests
